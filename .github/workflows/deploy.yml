name: Deploy to cPanel

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='config/config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='error_log' \
            --exclude='*.log' \
            --exclude='logs/' \
            --exclude='cache/' \
            --exclude='tmp/' \
            --exclude='temp/' \
            --exclude='uploads/' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            --exclude='README.md' \
            --exclude='sql/' \
            ./ deploy/

      - name: Deploy to dr.tvetcov.xyz
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          source: "deploy/*"
          target: "/home/pubquest/public_html/dr.tvetcov.xyz/"
          strip_components: 1
          overwrite: true
